name: coffee-rating

services:
  app:
    image: ghcr.io/raffaeldp/coffee-rating-app:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Paris}
      PORT: 3000 # container port; PORT in .env only sets the host port above
    volumes:
      - data:/data
      - uploads:/uploads

volumes:
  data:
  uploads:
